version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: financial-advisory-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./data:/app/data
      - ./vector_store:/app/vector_store
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: financial-advisory-frontend
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
